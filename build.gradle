plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.17'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	mods {
		"village-quests" {
			sourceSet sourceSets.main
		}
	}
	// Pass -PvillageExport to enable the castle export server:
	//   ./gradlew runServer -PvillageExport
	if (project.hasProperty('villageExport')) {
		runs {
			server {
				vmArg '-Dvillagecastles.exportall=true'
			}
		}
	}
}

dependencies {
	// Optional: block-tip integration, compile-only and never bundled. Resolved by the version
	// block-tip declares rather than a version written down here, because Gradle never clears
	// build/libs: this said 1.0.0 long after block-tip had moved on, and kept compiling green
	// against the jar an old build left behind - a jar that a clean, or a fresh clone, does not
	// have at all.
	def blockTipProperties = file("../block-tip/gradle.properties")
	if (blockTipProperties.exists()) {
		def blockTipVersion = new Properties().with {
			blockTipProperties.withInputStream { load(it) }
			getProperty("mod_version")
		}
		def blockTipJar = file("../block-tip/build/libs/block-tip-${blockTipVersion}.jar")
		if (!blockTipJar.exists()) {
			// Said plainly, because the alternative is javac reporting that BlockTipApi does not
			// exist: the integration below imports it outright, so the jar is only optional at
			// runtime. A clean, or a fresh clone, leaves this directory empty.
			throw new GradleException("block-tip ${blockTipVersion} is not built. Run `mc-build block-tip`" +
				" (or ./gradlew build in ../block-tip) first - this mod compiles against its API.")
		}
		compileOnly files(blockTipJar)
	}

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation(project(':pandorical'))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// Fail fast if stale project JARs are in run/mods/ — they shadow the dev classpath
// and cause old code to run silently. Run: ./gradlew validateRunMods
tasks.register('validateRunMods') {
    group = 'verification'
    description = 'Fails if village-quests or pandorical JARs are in run/mods/ (they conflict with the dev classpath).'
    doLast {
        def modsDir = file('run/mods')
        if (!modsDir.exists()) return
        def conflicts = modsDir.listFiles().findAll { f ->
            f.name.startsWith('village-quests') || f.name.startsWith('pandorical')
        }
        if (conflicts) {
            throw new GradleException(
                "Stale JARs found in run/mods/ — remove them (they conflict with the dev classpath):\n" +
                conflicts.collect { "  ${it.name}" }.join('\n')
            )
        }
        logger.lifecycle('run/mods/ is clean — no conflicting JARs found.')
    }
}

tasks.named('runServer').configure { dependsOn('validateRunMods') }

publishing {
	publications {
		maven(MavenPublication) {
			groupId = "justfatlard"
			artifactId = "village-quests"
			version = project.mod_version

			from components.java
		}
	}

	repositories {
		mavenLocal()
	}
}
